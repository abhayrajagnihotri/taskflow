services:

  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_password
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: taskflow-api
    restart: unless-stopped
    command: npm run start
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://taskflow:taskflow_password@postgres:5432/taskflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: taskflow_jwt_access_secret_key_taskflow_dev
      JWT_REFRESH_SECRET: taskflow_jwt_refresh_secret_key_taskflow_dev
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: taskflow-worker
    restart: unless-stopped
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://taskflow:taskflow_password@postgres:5432/taskflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: taskflow_jwt_access_secret_key_taskflow_dev
      JWT_REFRESH_SECRET: taskflow_jwt_refresh_secret_key_taskflow_dev
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data: